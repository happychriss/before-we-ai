# The vessel landscape — the independent one.
#
# Hanseatic Vessel Works Group GmbH: a fictional medium-sized shipbuilder, HQ
# and yard in Hamburg, a wholly owned yard in Gdansk (still called "Danzig" in
# legacy material). Ten business documents, no database — the shape a real
# mid-size company actually hands over.
#
# Why it exists: the finance landscape was written by the same people who wrote
# the tool, so a good score on it can always be explained by familiarity. This
# one was not. Its purpose is to be read once, cold, and to say something the
# first landscape structurally cannot.
#
# Deliberately unlike finance: no ERP export, German and Polish column names
# side by side, PLN next to EUR, merged spreadsheet headers, and four PDFs
# including a board report whose numbers disagree with the workbooks.

name: vessel
domain: finance
frozen: true
seed: 20250802

# A landscape-local guide, not the packaged finance pack. It adds the objects a
# shipbuilder has and a general ledger does not — build, labour allocation,
# overhead pool.
domain_guide:
  file: guide/simulated-domain-guide.yaml

# DO NOT OPEN. The answer key states which errors were seeded and what the
# right answer is; the generator contains the same table in code. Reading
# either one ends the blind evaluation permanently — and unlike a mistake in
# code, it cannot be reverted.
answer_key: answer-key/TRAPS_AND_ANSWER_KEY.md
generator: generator/generate_corpus.py

# Underspecified on purpose. A good system must not collapse cost-to-date,
# forecast cost, accepted-vessel revenue, percentage-of-completion, invoice
# volume, cash receipts, VAT, service revenue and intercompany activity into
# one unexplained number.
questions:
  - "What is the cost of building a vessel?"
  - "What were our sales in FY2025?"
  - "What is revenue per ship?"

