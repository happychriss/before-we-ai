# The finance landscape — the frozen one.
#
# Generated before the tool existed, so the traps are what an author thought of
# rather than what the implementation happens to handle. Every recorded number
# in this repository is scored against these bytes; `sha256` per source is the
# freeze, checked by src/tests/corpus_driven/test_corpus_is_frozen.py.
#
# The descriptions are not decoration: they are declared into `before-ai.yaml`
# and reach the model. Changing one changes a prompt, which changes a recorded
# fixture's input hash and turns the drift guard red — which is the intended
# behaviour, not a nuisance.

name: finance
domain: finance
frozen: true
seed: 0

# The product's own packaged domain pack, not a landscape-local file. It is
# clean by construction: definitions only, nothing corpus-specific, or it would
# be teaching to the test.
domain_guide:
  packaged: finance

# Do not open either of these. answer_key holds the expected verdict per trap;
# generator/ holds the code that seeded them, including the definitions of the
# blind traps the owner holds back. Reading them does not break a rule so much
# as destroy the measurement they exist to make possible.
answer_key: answer-key/expected_verdicts.yaml
generator: generator/generator_seed_0.py

# Specification both the generator and the grading harness build against —
# sources, trap classes K1-K8, the Z1-Z4 target questions, role definitions.
spec: spec/

held_out: [BLIND_1, BLIND_2, BLIND_3]

# Two, deliberately: with one answer type declared, classification had nothing
# to get wrong. The second is a near neighbour — also money in the ledger,
# naming no table, sharing three dependencies with the first.
questions:
  - "Can these files reliably produce actual P&L by entity and month?"
  - "What is still outstanding from our customers?"

# Declared to the pipeline, in this order. The three noise documents are
# declared on purpose: a document pipeline that only ever sees relevant
# documents has not been tested.
sources:
  - name: de_erp
    kind: duckdb
    path: DE/erp.duckdb
    sha256: 6ad0d146f6952d1046b6b0b023a42851c42fd99034c00a3561d3fd0467f6c1bb
    description: "The DE entity's ERP database as exported by IT — ledger, invoices, receivables, master data."
  - name: us_erp
    kind: duckdb
    path: US/erp.duckdb
    sha256: bc0ccae45db8d2bb382e20add9c3ab916f1f241928bd8261536f8d4034b1c83e
    description: "The US entity's ERP database, same export, same shapes."
  - name: kunden_migration
    kind: xlsx
    path: kunden_migration.xlsx
    sha256: a606866d15303fcb9107fd68c33983f04c072f594cb429ac056be24a9e252f85
    description: "Spreadsheet from the customer-number migration: which old number became which new one."
  - name: marketing_grouping
