# Exact environment for CI and the Docker image — the offline lane only.
#
# Why a lock next to a pyproject with ranges: pyproject.toml declares what the
# library tolerates; this file declares what the recorded numbers were produced
# with. Every version here is the one the green suite ran against, not the
# newest that resolves today — a fresh resolve already drifts (python-ulid 3→4,
# packaging, Pygments), and a measurement environment that moves on its own is
# not a measurement environment.
#
# Deliberately absent: `anthropic`. It is the `llm` extra, online mode only;
# CI, Docker and the offline stub never import the SDK. Install it separately
# for a recording session (`pip install -e ".[llm]"`).
#
# Regenerate: create a clean venv, `pip install -e ".[dev]"`, then
# `pip freeze --exclude-editable` minus setuptools/wheel — and re-run the full
# suite before committing the result.

