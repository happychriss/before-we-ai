[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "before-we-ai"
version = "0.1.0"
description = "Evidence-based context discovery — claims with epistemic status, never a silent wrong answer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-ulid>=2.2",
    # Pinned EXACT: the FTS extension is built per DuckDB version and is
    # installed into ~/.duckdb/extensions/<version>/ — a bump silently
    # invalidates the installed extension (scripts/bootstrap.sh).
    "duckdb==1.5.4",
    # Pinned EXACT: text extraction is deterministic only per version, and
    # chunk bytes feed fixture hashes — a bump is a deliberate re-record event
    # (docs/architecture.md → "Documents & V3").
    "pymupdf==1.28.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# online mode only — CI and the offline stub never import the SDK
llm = [
    "anthropic>=0.40",
]

[tool.setuptools]
# src-layout: this file lives at the repository root, the code lives in src/.
package-dir = {"" = "src"}

# Discovered, not listed. A hand-maintained package list drifts from disk the
# moment a subpackage is added, and the failure is silent until someone
# installs from a fresh clone. The include filter is what keeps control:
# nothing outside these two trees ships, and src/corpus + src/tests carry no
# __init__.py, so they can never be picked up.
[tool.setuptools.packages.find]
where = ["src"]
include = ["before_we_ai*", "readiness_report*"]

[tool.setuptools.package-data]
"before_we_ai.checks" = ["templates/*.sql.j2"]
"before_we_ai.domains" = ["*.yaml"]
"readiness_report" = [
    "templates/*.html.j2",
    "static/*.css",
    "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# Lanes say what CLASS of thing a red test is about, so a failure points at
# the layer that owns it. The full suite stays the release gate — these only
# decide what is worth running between edits.
addopts = "--strict-markers"
markers = [
    "unit: pure logic — no project directory, no model, no corpus",
    "integration: package boundaries over a temporary project store",
    "contract: the model-facing interface — prompts, schemas, fixtures, drift",
    "acceptance: the product promise, against the frozen corpus",
]
