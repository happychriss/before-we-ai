# Finance domain guide — curated data, not code (Regel der Drei: no ontology,
# no plugin framework before a third domain forces one).
#
# CLEAN BY CONSTRUCTION: definitions only — no examples, no source names,
# no hints. The definitions are passed into LLM prompts; anything
# corpus-specific here would teach to the test and invalidate
# Seeded-Recall. The corpus generator's own roles.yaml
# (src/corpus/generator_spec/) is NOT usable at runtime for exactly that
# reason.
#
# Business objects carry fields. An object is what a domain law judges; a
# field is carried inside its object's law or decided by a human — a field
# can never declare a law, the schema does not allow it.
#
# decided_by declares each entry's settlement path (linted on load; it never
# enters a prompt): for an object the domain law that can elect it, or
# "clarification" — no arithmetic can decide what a column *means*, the
# candidates go to the humans. For a field "slot" (plus fills: which slot of
# its object's law it is — the passing run settles it with the column it
# consumed) or "clarification". Every object and every clarification-decided
# field ends in a check verdict or a clarification question, never in nothing.
domain: finance
objects:
  journal:
    decided_by: balance
    definition: >-
      The transactional ledger of record: one row per posting line, carrying a
      signed amount and a document reference; debit and credit lines balance
      per document.
    fields:
      amount_local:
        decided_by: slot
        fills: amount
        definition: >-
          The signed posting amount in local currency on the journal — the column
          that must sum to zero per document.
      doc_ref:
        # not a slot: a journal balances per document AND per period AND per
        # year, so a passing balance run never proves what its grouping
        # column *means*.
        decided_by: clarification
        definition: >-
          The document (voucher) reference that groups journal lines into balanced
          postings.
      account:
        decided_by: clarification
        definition: >-
          The account identifier on the journal, resolvable against a chart of
          accounts.
      period:
        decided_by: clarification
        definition: >-
          The posting period on the journal, at fiscal-period granularity.
      entity:
        decided_by: clarification
        definition: >-
          The legal entity or company code a posting belongs to.
  subledger_ar:
    decided_by: subledger_equals_gl
    definition: >-
      The accounts-receivable open items: one row per open receivable with a
      signed amount, reconcilable against the journal's control account.
  intercompany:
    decided_by: ic_symmetry
    definition: >-
      Paired intercompany postings between two entities that must mirror each
      other per period.
